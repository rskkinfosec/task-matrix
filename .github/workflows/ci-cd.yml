name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # JOB 1: Run tests
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Install dependencies
      run: npm install
      working-directory: TaskMatrix-PWA-iOS/tests

    - name: Run test suite
      run: npm test
      working-directory: TaskMatrix-PWA-iOS/tests

    - name: Report test status
      if: always()
      run: echo "Test run completed for Node ${{ matrix.node-version }}"

  # JOB 2: Verify all tests passed before deployment
  verify-tests:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Verify test results
      run: |
        echo "✅ All test jobs completed successfully"
        echo "Tests passed on Node.js: 18.x and 20.x"
        echo "Proceeding with deployment..."

    - name: Check build artifacts
      shell: bash
      run: |
        echo "Build verification"
        ls -la TaskMatrix-PWA-iOS/index.html
        ls -la TaskMatrix-PWA-iOS/manifest.json
        ls -la TaskMatrix-PWA-iOS/service-worker.js
        echo "✅ All required files present"

    - name: Status Summary
      run: |
        echo "================================"
        echo "CI/CD Pipeline Status"
        echo "================================"
        echo "✅ Tests: PASSED"
        echo "✅ Build Artifacts: VERIFIED"
        echo "✅ Ready for Deployment"
        echo "================================"
        echo "Jekyll deployment will now proceed automatically"
        echo "Live app: https://rskkinfosec.github.io/TaskMatrix-PWA-iOS/"
