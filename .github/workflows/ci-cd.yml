name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # JOB 1: Run tests
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Install dependencies
      run: npm install
      working-directory: TaskMatrix-PWA-iOS/tests

    - name: Run test suite
      run: npm test
      working-directory: TaskMatrix-PWA-iOS/tests

    - name: Report test status
      if: always()
      run: echo "Test run completed for Node ${{ matrix.node-version }}"
