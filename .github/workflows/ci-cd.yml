name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # JOB 1: Run tests
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Install dependencies
      run: npm install
      working-directory: TaskMatrix-PWA-iOS/tests

    - name: Run test suite
      run: npm test
      working-directory: TaskMatrix-PWA-iOS/tests

    - name: Report test status
      if: always()
      run: echo "Test run completed for Node ${{ matrix.node-version }}"

  # JOB 2: Deploy ONLY if tests pass
  deploy:
    needs: test  # This makes deploy wait for test to complete successfully
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'  # Only on main branch push

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Check build artifacts
      shell: bash
      run: |
        echo "Build verification"
        ls -la TaskMatrix-PWA-iOS/index.html
        ls -la TaskMatrix-PWA-iOS/manifest.json
        ls -la TaskMatrix-PWA-iOS/service-worker.js
        echo "All required files present"

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./TaskMatrix-PWA-iOS
        exclude_assets: '.github,.gitignore,tests,*.md,*.txt'
        keep_files: true

    - name: Deployment Summary
      if: always()
      run: |
        echo "Deployment Status: ${{ job.status }}"
        echo "Live at: https://rskkinfosec.github.io/TaskMatrix-PWA-iOS/"
