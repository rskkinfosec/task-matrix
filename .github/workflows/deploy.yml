name: Deploy to GitHub Pages (Disabled - Using Jekyll)

# This workflow is disabled because GitHub's built-in Jekyll workflow
# (pages-build-and-deployment) already handles deployment automatically
# and works reliably. This custom workflow is kept as a backup.

on:
  workflow_dispatch:  # Manual trigger only

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'

    - name: Install test dependencies
      run: npm install
      working-directory: TaskMatrix-PWA-iOS/tests

    - name: Run full test suite
      run: npm run test:all
      working-directory: TaskMatrix-PWA-iOS/tests

    - name: Check build artifacts
      shell: bash
      run: |
        echo "Build verification"
        ls -la TaskMatrix-PWA-iOS/index.html
        ls -la TaskMatrix-PWA-iOS/manifest.json
        ls -la TaskMatrix-PWA-iOS/service-worker.js
        echo "All required files present"

    - name: Deploy to GitHub Pages
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./TaskMatrix-PWA-iOS
        exclude_assets: '.github,.gitignore,tests,*.md,*.txt'
        keep_files: true

    - name: Deployment Summary
      if: always()
      run: |
        echo "Deployment Status: ${{ job.status }}"
        echo "Live at: https://rskkinfosec.github.io/TaskMatrix-PWA-iOS/"
